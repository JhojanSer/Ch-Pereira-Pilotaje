  };
  firebase.initializeApp(firebaseConfig);
  const fbAuth = firebase.auth();
  const fbDb = firebase.firestore();
  const fbStorage = firebase.storage();

  // Crea un usuario de Auth SIN cerrar la sesión del coordinador que lo está creando,
  // usando una instancia secundaria y temporal de la app de Firebase.
  async function createAuthUserKeepingSession(email, password) {
    const secondaryApp = firebase.initializeApp(firebaseConfig, "Secondary_" + Date.now());
    const secondaryAuth = secondaryApp.auth();
    try {
      const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
      const newUid = cred.user.uid;
      await secondaryAuth.signOut();
      await secondaryApp.delete();
      return newUid;
    } catch (err) {
      await secondaryApp.delete();
      throw err;
    }
  }
</script>

/* =========================================================================

function fsSubscribe(collectionName, cb, onError) {
  return fbDb.collection(collectionName).onSnapshot(
    snap => {
      const arr = [];
      snap.forEach(doc => arr.push({ id: doc.id, ...doc.data() }));
      cb(arr);
    },
    err => { if (onError) onError(err); else console.error(err); }
  );
}
function fsSubscribeDoc(collectionName, id, cb, onError) {
  return fbDb.collection(collectionName).doc(id).onSnapshot(
    doc => cb(doc.exists ? { id: doc.id, ...doc.data() } : null),
    err => { if (onError) onError(err); else console.error(err); }
  );
}
async function fsSet(collectionName, id, data) {
  return fbDb.collection(collectionName).doc(id).set(data, { merge: true });
}
async function fsDelete(collectionName, id) {
  return fbDb.collection(collectionName).doc(id).delete();
}
function fsNewId(collectionName) {
  return fbDb.collection(collectionName).doc().id;
}
function storageRef(path) { return fbStorage.ref().child(path); }
async function uploadDocumentFile(file, projectId, user, onProgress) {

  return await new Promise((resolve, reject) => {
    task.on("state_changed", snap => {
      if (onProgress) onProgress(Math.round((snap.bytesTransferred / snap.totalBytes) * 100));
    }, reject, async () => {
      try {
        const record = { id: docId, projectId, name: file.name, safeName, size: file.size, contentType: file.type || "application/octet-stream", storagePath: path, uploadedBy: user.uid, uploadedByName: `${user.nombre || ""} ${user.apellidos || ""}`.trim(), uploadedAt: new Date().toISOString() };
        await fsSet("documentosObra", docId, record);
        resolve(record);
      } catch (e) { reject(e); }
    });
  });
}
async function deleteDocumentFile(doc) {
  if (doc.storagePath) { try { await storageRef(doc.storagePath).delete(); } catch (e) { console.warn("No se pudo eliminar el archivo del Storage", e); } }
  await fsDelete("documentosObra", doc.id);
}
async function openDocumentFile(doc) {
  if (!doc.storagePath) throw new Error("El documento no tiene ruta de almacenamiento.");
  const blob = await storageRef(doc.storagePath).getBlob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = doc.name;
  a.target = "_blank";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/* =========================================================================
   UTILIDADES
========================================================================= */
function uid(prefix) {
  return (prefix || "id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function round(n, d) {
  const f = Math.pow(10, d);
  return Math.round((n + Number.EPSILON) * f) / f;
}
function volumenTeorico(diametroM, longitudConcretoM) {
  const r = diametroM / 2;
  return Math.PI * r * r * longitudConcretoM;
}
function porcentajeExpansion(volReal, volTeorico) {
  if (!volTeorico) return 0;
  return ((volReal - volTeorico) / volTeorico) * 100;
}
function fmtFecha(iso) {
  if (!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("es-CO", { day: "2-digit", month: "short", year: "numeric" });
}
function fmtFechaHora(ts) {
  const d = new Date(ts);
  return d.toLocaleString("es-CO", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
}
function nextConsecutivo(reports, projectId) {
  const count = reports.filter(r => r.proyectoId === projectId).length;
  return count + 1;
}
function toCSV(rows) {
  if (!rows.length) return "";
  const headers = Object.keys(rows[0]);
  const escapeCell = (v) => {
    const s = (v === undefined || v === null) ? "" : String(v);
    if (s.includes(",") || s.includes('"') || s.includes("\n")) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  };
  const lines = [headers.join(",")];
  rows.forEach(row => lines.push(headers.map(h => escapeCell(row[h])).join(",")));
  return lines.join("\n");
}
function downloadCSV(filename, csvString) {
  const blob = new Blob(["\uFEFF" + csvString], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

const AUTH_ERROR_MESSAGES = {
  "auth/invalid-email": "El correo electrónico no es válido.",
  "auth/user-disabled": "Esta cuenta está deshabilitada.",
  "auth/user-not-found": "No existe una cuenta con ese correo.",
  "auth/wrong-password": "Contraseña incorrecta.",
  "auth/invalid-credential": "Correo o contraseña incorrectos.",
  "auth/too-many-requests": "Demasiados intentos. Espera un momento e inténtalo de nuevo.",
  "auth/network-request-failed": "Error de conexión. Verifica tu internet."
};

function LoginScreen() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [resetSent, setResetSent] = useState(false);
  const [loading, setLoading] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setError("");
    setResetSent(false);
    setLoading(true);
    try {
      await fbAuth.signInWithEmailAndPassword(email.trim(), password);
    } catch (err) {
      setError(AUTH_ERROR_MESSAGES[err.code] || "No se pudo iniciar sesión. Intenta de nuevo.");
    }
    setLoading(false);
  }

  async function handleForgotPassword() {
    if (!email.trim()) { setError("Escribe tu correo arriba y vuelve a intentar."); return; }
    setError("");
    try {
      await fbAuth.sendPasswordResetEmail(email.trim());
      setResetSent(true);
    } catch (err) {
      setError(AUTH_ERROR_MESSAGES[err.code] || "No se pudo enviar el correo de restablecimiento.");
    }
  }

  return (
    <div className="min-h-screen flex items-center justify-center px-[2rem] bg-gradient-to-br from-chp-bg via-white to-chp-bg">
      <div className="w-full max-w-[46rem] fade-slide">
        <div className="flex justify-center mb-[2.8rem]">
          <img src={LOGO_SRC} alt="Ch Pereira Construcciones" className="h-[6rem] object-contain" />
        </div>
        <Card className="p-[3.2rem]">
          <h1 className="text-[2.2rem] font-extrabold text-chp-blue mb-[0.4rem]">Acceso al sistema</h1>
          <p className="text-[1.4rem] text-chp-grayLight mb-[2.6rem]">Reportes diarios de excavación y fundida de pilotes</p>

          <form onSubmit={handleSubmit}>
            <Field label="Correo electrónico" required>
              <TextInput type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="nombre@chpereira.com" autoFocus />
            </Field>
            <Field label="Contraseña" required>
              <TextInput type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Ingresa tu contraseña" />
            </Field>

            {error && (
              <div className="flex items-center gap-[0.8rem] text-red-600 bg-red-50 border border-red-200 rounded-[0.8rem] px-[1.4rem] py-[1rem] text-[1.35rem] mb-[1.6rem]">
                <Icon.alert className="w-[1.8rem] h-[1.8rem] shrink-0" />
                {error}
              </div>
            )}
            {resetSent && (
              <div className="flex items-center gap-[0.8rem] text-chp-greenDark bg-chp-green/10 rounded-[0.8rem] px-[1.4rem] py-[1rem] text-[1.35rem] mb-[1.6rem]">
                <Icon.check className="w-[1.6rem] h-[1.6rem] shrink-0" /> Te enviamos un correo para restablecer tu contraseña.
              </div>
            )}

            <Button type="submit" variant="secondary" className="w-full justify-center mt-[0.6rem]" disabled={loading}>
              <Icon.lock className="w-[1.6rem] h-[1.6rem]" /> {loading ? "Entrando..." : "Entrar"}
            </Button>
            <button type="button" onClick={handleForgotPassword} className="w-full text-center text-[1.3rem] text-chp-blue font-semibold mt-[1.4rem] hover:underline">
              Olvidé mi contraseña
            </button>
          </form>
        </Card>
        <p className="text-center text-[1.2rem] text-chp-grayLight mt-[2rem]">
          Cada usuario accede únicamente con su propia contraseña. Contacta al coordinador de proyectos si la olvidaste.
        </p>
      </div>
    </div>
  );
}

  return (

                  (view === t.key ? "bg-white text-chp-blue shadow-sm" : "text-chp-grayLight hover:text-chp-blue")}
              >
                <t.icon className="w-[1.6rem] h-[1.6rem]" /> {t.label}

          <div className="text-right hidden sm:block">

            <div className="text-[1.15rem] text-chp-grayLight leading-tight">{user.role === "coordinador" ? "Coordinador de Proyectos" : "Ingeniero de Obra"}</div>
          </div>
          <div className="w-[3.8rem] h-[3.8rem] rounded-full bg-chp-blue text-white flex items-center justify-center font-bold text-[1.4rem] shrink-0">
            {(user.nombre || "?").charAt(0)}{(user.apellidos || "").charAt(0)}
          </div>
          <button onClick={onLogout} title="Cerrar sesión" className="w-[3.8rem] h-[3.8rem] rounded-[0.8rem] border border-gray-200 flex items-center justify-center text-chp-grayLight hover:text-red-600 hover:border-red-200 transition-all">
            <Icon.logout className="w-[1.8rem] h-[1.8rem]" />
          </button>
        </div>
      </div>
    </header>
  );
}

/* =========================================================================
   FORMULARIO DE REPORTE DIARIO (mobile-first, por pasos)
========================================================================= */
const STEPS = [
  { key: "generales", label: "Datos generales" },
  { key: "pilote", label: "Pilote" },
  { key: "concreto", label: "Concreto" },
  { key: "cantidades", label: "Cantidades" },
  { key: "equipos", label: "Equipos y tiempos" },
  { key: "acero", label: "Acero de refuerzo" },
  { key: "observaciones", label: "Observaciones" }
];

function emptyReport(user, projects, reports) {
  const firstProject = projects[0];
  return {
    id: "",
    responsable: user.nombre + " " + user.apellidos,
    fecha: new Date().toISOString().slice(0, 10),
    consecutivo: firstProject ? nextConsecutivo(reports, firstProject.id) : 1,
    proyectoId: firstProject ? firstProject.id : "",
    contratante: firstProject ? firstProject.contratante : "",
    elemento: "",
    diametro: "",
    profundidad: "",
    tipoConcreto: TIPOS_CONCRETO[0],
    resistenciaConcreto: RESISTENCIAS_CONCRETO[0],
    mixer: "",
    longExcavacion: "",
    longConcreto: "",
    volReal: "",
    equipoPerforacion: EQUIPOS_PERFORACION[0],
    tipoPerforacion: TIPOS_PERFORACION[0],
    fechaExcavacion: new Date().toISOString().slice(0, 10),
    horaInicioExcavacion: "",
    duracionExcavacion: "",
    horaInicioFundida: "",
    duracionFundida: "",
    aceroVertical: "",
    aceroTransversal: "",
    observaciones: ""
  };
}

function ReportForm({ user, projects, reports, onSave, editing, onDoneEditing, showToast }) {
  const [step, setStep] = useState(0);
  const [form, setForm] = useState(() => editing || emptyReport(user, projects, reports));
  const [errors, setErrors] = useState({});

  useEffect(() => {
    setForm(editing || emptyReport(user, projects, reports));
    setStep(0);
  }, [editing]);

  const volTeorico = useMemo(() => {
    const d = parseFloat(form.diametro);
    const l = parseFloat(form.longConcreto);
    if (!d || !l) return 0;
    return volumenTeorico(d, l);
  }, [form.diametro, form.longConcreto]);

  const expansion = useMemo(() => {
    const vr = parseFloat(form.volReal);
    if (!vr || !volTeorico) return 0;
    return porcentajeExpansion(vr, volTeorico);
  }, [form.volReal, volTeorico]);

  function update(field, value) {
    setForm(prev => ({ ...prev, [field]: value }));
  }
  function updateProject(projectId) {
    const p = projects.find(pr => pr.id === projectId);
    setForm(prev => ({
      ...prev,
      proyectoId: projectId,
      contratante: p ? p.contratante : "",
      consecutivo: editing && editing.proyectoId === projectId ? editing.consecutivo : (p ? nextConsecutivo(reports, projectId) : 1)
    }));
  }

  function validateStep(idx) {
    const key = STEPS[idx].key;
    const errs = {};
    const numNonNegative = (val, name) => {
      if (val === "" || val === null || val === undefined) return;
      if (parseFloat(val) < 0) errs[name] = "No puede ser negativo";
    };
    if (key === "generales") {
      if (!form.responsable) errs.responsable = "Requerido";
      if (!form.fecha) errs.fecha = "Requerido";
      if (!form.proyectoId) errs.proyectoId = "Requerido";
      numNonNegative(form.consecutivo, "consecutivo");
    }
    if (key === "pilote") {
      if (!form.elemento) errs.elemento = "Requerido";
      numNonNegative(form.diametro, "diametro");
      numNonNegative(form.profundidad, "profundidad");
    }
    if (key === "cantidades") {
      numNonNegative(form.longExcavacion, "longExcavacion");
      numNonNegative(form.longConcreto, "longConcreto");
      numNonNegative(form.volReal, "volReal");
    }
    if (key === "equipos") {
      numNonNegative(form.duracionExcavacion, "duracionExcavacion");
      numNonNegative(form.duracionFundida, "duracionFundida");
    }
    setErrors(errs);
    return Object.keys(errs).length === 0;
  }

  function goNext() {
    if (!validateStep(step)) return;
    if (step < STEPS.length - 1) setStep(step + 1);
  }
  function goBack() {
    setErrors({});
    if (step > 0) setStep(step - 1);
  }

  function handleSubmit() {
    if (!validateStep(step)) return;
    const record = {
      ...form,
      id: form.id || uid("rep"),
      diametro: parseFloat(form.diametro) || 0,
      profundidad: parseFloat(form.profundidad) || 0,
      longExcavacion: parseFloat(form.longExcavacion) || 0,
      longConcreto: parseFloat(form.longConcreto) || 0,
      volReal: parseFloat(form.volReal) || 0,
      volTeorico: round(volTeorico, 3),
      porcentajeExpansion: round(expansion, 2),
      duracionExcavacion: parseFloat(form.duracionExcavacion) || 0,
      duracionFundida: parseFloat(form.duracionFundida) || 0,
      consecutivo: parseFloat(form.consecutivo) || 1,
      ingenieroId: user.id,
      createdAt: form.createdAt || Date.now()
    };
    onSave(record);
    showToast(editing ? "Reporte actualizado" : "Reporte guardado");
    if (editing) {
      onDoneEditing();
    } else {
      setForm(emptyReport(user, projects, reports));
    }
    setStep(0);
  }

  const myProjects = projects.filter(p => user.role === "coordinador" || (user.projectIds || []).includes(p.id));
  const stepKey = STEPS[step].key;

  return (
    <div className="max-w-[74rem] mx-auto">
      {/* Stepper header */}
      <div className="flex items-center gap-[0.4rem] overflow-x-auto pb-[1.6rem] mb-[1.6rem] -mx-[0.4rem] px-[0.4rem]">
        {STEPS.map((s, idx) => (
          <React.Fragment key={s.key}>
            <button
              onClick={() => { if (idx <= step || validateStep(step)) setStep(idx); }}
              className={"shrink-0 flex items-center gap-[0.8rem] px-[1.4rem] py-[0.9rem] rounded-full text-[1.3rem] font-semibold transition-all border-[0.15rem] " +
                (idx === step ? "bg-chp-blue text-white border-chp-blue" : idx < step ? "bg-chp-green/15 text-chp-greenDark border-chp-green/40" : "bg-white text-chp-grayLight border-gray-200")}
            >
              {idx < step ? <Icon.check className="w-[1.4rem] h-[1.4rem]" /> : <span>{idx + 1}</span>}
              {s.label}
            </button>
            {idx < STEPS.length - 1 && <div className="w-[1.6rem] h-[0.15rem] bg-gray-200 shrink-0" />}
          </React.Fragment>
        ))}
      </div>

      <Card className="p-[2rem] sm:p-[2.8rem] fade-slide" key={step}>
        {stepKey === "generales" && (
          <div>
            <SectionTitle>Datos generales</SectionTitle>
            <div className="grid sm:grid-cols-2 gap-x-[1.6rem]">
              <Field label="Responsable de la obra" required>
                <TextInput value={form.responsable} onChange={e => update("responsable", e.target.value)} />
                {errors.responsable && <ErrorText>{errors.responsable}</ErrorText>}
              </Field>
              <Field label="Fecha" required>
                <TextInput type="date" value={form.fecha} onChange={e => update("fecha", e.target.value)} />
                {errors.fecha && <ErrorText>{errors.fecha}</ErrorText>}
              </Field>
              <Field label="Proyecto" required>
                <SelectInput value={form.proyectoId} onChange={e => updateProject(e.target.value)}>
                  <option value="">Selecciona un proyecto</option>
                  {myProjects.map(p => <option key={p.id} value={p.id}>{p.nombre}</option>)}
                </SelectInput>
                {errors.proyectoId && <ErrorText>{errors.proyectoId}</ErrorText>}
              </Field>
              <Field label="Contratante" hint="Autocompletado según el proyecto">
                <TextInput value={form.contratante} readOnly className="bg-gray-50 text-chp-grayLight" />
              </Field>
              <Field label="Consecutivo" required>
                <TextInput type="number" min="1" value={form.consecutivo} onChange={e => update("consecutivo", e.target.value)} />
                {errors.consecutivo && <ErrorText>{errors.consecutivo}</ErrorText>}
              </Field>
            </div>
          </div>
        )}

        {stepKey === "pilote" && (
          <div>
            <SectionTitle>Identificación del pilote</SectionTitle>
            <div className="grid sm:grid-cols-3 gap-x-[1.6rem]">
              <Field label="Elemento N°" required hint="Ej: P-01">
                <TextInput value={form.elemento} onChange={e => update("elemento", e.target.value)} placeholder="P-01" />
                {errors.elemento && <ErrorText>{errors.elemento}</ErrorText>}
              </Field>
              <Field label="Diámetro (m)" required>
                <TextInput type="number" min="0" step="0.01" value={form.diametro} onChange={e => update("diametro", e.target.value)} />
                {errors.diametro && <ErrorText>{errors.diametro}</ErrorText>}
              </Field>
              <Field label="Profundidad (m)" required>
                <TextInput type="number" min="0" step="0.01" value={form.profundidad} onChange={e => update("profundidad", e.target.value)} />
                {errors.profundidad && <ErrorText>{errors.profundidad}</ErrorText>}
              </Field>
            </div>
          </div>
        )}

        {stepKey === "concreto" && (
          <div>
            <SectionTitle>Concreto</SectionTitle>
            <div className="grid sm:grid-cols-2 gap-x-[1.6rem]">
              <Field label="Tipo de concreto">
                <SelectInput value={form.tipoConcreto} onChange={e => update("tipoConcreto", e.target.value)}>
                  {TIPOS_CONCRETO.map(t => <option key={t} value={t}>{t}</option>)}
                </SelectInput>
              </Field>
              <Field label="Resistencia del concreto">
                <SelectInput value={form.resistenciaConcreto} onChange={e => update("resistenciaConcreto", e.target.value)}>
                  {RESISTENCIAS_CONCRETO.map(r => <option key={r} value={r}>{r}</option>)}
                </SelectInput>
              </Field>
              <Field label="N° de Mixer / Empresa">
                <TextInput value={form.mixer} onChange={e => update("mixer", e.target.value)} placeholder="Ej: Concrecol — Mixer 14" />
              </Field>
            </div>
          </div>
        )}

        {stepKey === "cantidades" && (
          <div>
            <SectionTitle>Datos y cantidades del pilote</SectionTitle>
            <div className="grid sm:grid-cols-2 gap-x-[1.6rem]">
              <Field label="Longitud de excavación (m)">
                <TextInput type="number" min="0" step="0.01" value={form.longExcavacion} onChange={e => update("longExcavacion", e.target.value)} />
                {errors.longExcavacion && <ErrorText>{errors.longExcavacion}</ErrorText>}
              </Field>
              <Field label="Longitud de concreto (m)">
                <TextInput type="number" min="0" step="0.01" value={form.longConcreto} onChange={e => update("longConcreto", e.target.value)} />
                {errors.longConcreto && <ErrorText>{errors.longConcreto}</ErrorText>}
              </Field>
              <Field label="Volumen teórico de concreto (m³)" hint="π × (Diámetro/2)² × Longitud de concreto">
                <TextInput value={round(volTeorico, 3)} readOnly className="bg-gray-50 font-semibold text-chp-blue" />
              </Field>
              <Field label="Volumen real de concreto (m³)" required>
                <TextInput type="number" min="0" step="0.01" value={form.volReal} onChange={e => update("volReal", e.target.value)} />
                {errors.volReal && <ErrorText>{errors.volReal}</ErrorText>}
              </Field>
            </div>
            <div className={"rounded-[1rem] px-[1.8rem] py-[1.4rem] flex items-center justify-between mt-[0.4rem] " + (expansion > 10 ? "bg-red-50" : "bg-chp-green/10")}>
              <span className="text-[1.4rem] font-semibold">Porcentaje de expansión</span>
              <span className={"text-[2rem] font-extrabold " + (expansion > 10 ? "text-red-600" : "text-chp-greenDark")}>{round(expansion, 2)}%</span>
            </div>
          </div>
        )}

        {stepKey === "equipos" && (
          <div>
            <SectionTitle>Equipos y tiempos</SectionTitle>
            <div className="grid sm:grid-cols-2 gap-x-[1.6rem]">
              <Field label="Equipo de perforación">
                <SelectInput value={form.equipoPerforacion} onChange={e => update("equipoPerforacion", e.target.value)}>
                  {EQUIPOS_PERFORACION.map(t => <option key={t} value={t}>{t}</option>)}
                </SelectInput>
              </Field>
              <Field label="Tipo de perforación">
                <SelectInput value={form.tipoPerforacion} onChange={e => update("tipoPerforacion", e.target.value)}>
                  {TIPOS_PERFORACION.map(t => <option key={t} value={t}>{t}</option>)}
                </SelectInput>
              </Field>
              <Field label="Fecha de excavación">
                <TextInput type="date" value={form.fechaExcavacion} onChange={e => update("fechaExcavacion", e.target.value)} />
              </Field>
              <div></div>
              <Field label="Hora inicio de excavación">
                <TextInput type="time" value={form.horaInicioExcavacion} onChange={e => update("horaInicioExcavacion", e.target.value)} />
              </Field>
              <Field label="Duración de excavación (min)">
                <TextInput type="number" min="0" value={form.duracionExcavacion} onChange={e => update("duracionExcavacion", e.target.value)} />
                {errors.duracionExcavacion && <ErrorText>{errors.duracionExcavacion}</ErrorText>}
              </Field>
              <Field label="Hora inicio de fundida">
                <TextInput type="time" value={form.horaInicioFundida} onChange={e => update("horaInicioFundida", e.target.value)} />
              </Field>
              <Field label="Duración de fundida (min)">
                <TextInput type="number" min="0" value={form.duracionFundida} onChange={e => update("duracionFundida", e.target.value)} />
                {errors.duracionFundida && <ErrorText>{errors.duracionFundida}</ErrorText>}
              </Field>
            </div>
          </div>
        )}

        {stepKey === "acero" && (
          <div>
            <SectionTitle>Acero de refuerzo</SectionTitle>
            <Field label="Acero de refuerzo vertical" hint="Ej: 8 varillas #6">
              <TextInput value={form.aceroVertical} onChange={e => update("aceroVertical", e.target.value)} placeholder="8 varillas #6" />
            </Field>
            <Field label="Acero de refuerzo transversal" hint="Ej: Espiral #3 cada 10cm">
              <TextInput value={form.aceroTransversal} onChange={e => update("aceroTransversal", e.target.value)} placeholder="Espiral #3 cada 10cm" />
            </Field>
          </div>
        )}

        {stepKey === "observaciones" && (
          <div>
            <SectionTitle>Observaciones</SectionTitle>
            <Field label="Observaciones generales">
              <TextArea value={form.observaciones} onChange={e => update("observaciones", e.target.value)} placeholder="Novedades, condiciones del terreno, incidencias durante la excavación o fundida..." />
            </Field>
            <div className="bg-chp-bg rounded-[1rem] p-[1.8rem] mt-[1rem]">
              <p className="text-[1.3rem] font-semibold text-chp-blue mb-[0.8rem]">Resumen del reporte</p>
              <div className="grid sm:grid-cols-2 gap-y-[0.6rem] text-[1.35rem]">
                <span>Elemento: <strong>{form.elemento || "—"}</strong></span>
                <span>Proyecto: <strong>{(myProjects.find(p=>p.id===form.proyectoId) || {}).nombre || "—"}</strong></span>
                <span>Concreto: <strong>{form.tipoConcreto} · {form.resistenciaConcreto}</strong></span>
                <span>Volumen teórico: <strong>{round(volTeorico,3)} m³</strong></span>
                <span>Volumen real: <strong>{form.volReal || 0} m³</strong></span>
                <span>Expansión: <strong>{round(expansion,2)}%</strong></span>
              </div>
            </div>
          </div>
        )}
      </Card>

      <div className="flex items-center justify-between mt-[2rem] gap-[1.2rem]">
        <div>
          {step > 0 && <Button variant="ghost" onClick={goBack}>Atrás</Button>}
          {editing && <Button variant="ghost" onClick={onDoneEditing} className="ml-[0.8rem]">Cancelar edición</Button>}
        </div>
        {step < STEPS.length - 1 ? (
          <Button variant="secondary" onClick={goNext}>Siguiente <Icon.chevronRight className="w-[1.6rem] h-[1.6rem]" /></Button>
        ) : (
          <Button variant="primary" onClick={handleSubmit}><Icon.check className="w-[1.6rem] h-[1.6rem]" /> {editing ? "Guardar cambios" : "Guardar reporte"}</Button>
        )}
      </div>
    </div>
  );
}
function SectionTitle({ children }) {
  return <h2 className="text-[1.9rem] font-bold text-chp-blue mb-[2rem]">{children}</h2>;
}
function ErrorText({ children }) {
  return <span className="text-[1.2rem] text-red-600 font-medium">{children}</span>;
}

/* =========================================================================
   LISTADO "MIS REPORTES" (ingeniero)
========================================================================= */
function MyReportsList({ user, projects, reports, onEdit, onDelete }) {
  const mine = reports.filter(r => r.ingenieroId === user.id).sort((a,b) => b.createdAt - a.createdAt);
  const projectName = (id) => (projects.find(p => p.id === id) || {}).nombre || "—";

  if (mine.length === 0) {
    return (
      <Card className="p-[4rem] text-center text-chp-grayLight">
        <p className="text-[1.5rem]">Aún no has registrado reportes de pilotes. Ve a "Nuevo registro" para empezar.</p>
      </Card>
    );
  }

  return (
    <div className="grid gap-[1.2rem]">
      {mine.map(r => (
        <Card key={r.id} className="p-[1.8rem] flex flex-col sm:flex-row sm:items-center gap-[1.2rem] justify-between">
          <div className="min-w-0">
            <div className="flex items-center gap-[1rem] flex-wrap">
              <span className="font-bold text-[1.6rem]">{r.elemento}</span>
              <Badge tone="blue">{projectName(r.proyectoId)}</Badge>
              <Badge tone={r.porcentajeExpansion > 10 ? "red" : "green"}>{r.porcentajeExpansion}% expansión</Badge>
            </div>
            <p className="text-[1.3rem] text-chp-grayLight mt-[0.4rem]">
              {fmtFecha(r.fecha)} · Consecutivo #{r.consecutivo} · Ø{r.diametro}m × {r.profundidad}m
            </p>
          </div>
          <div className="flex gap-[0.8rem] shrink-0">
            <Button variant="ghost" onClick={() => onEdit(r)}><Icon.edit className="w-[1.5rem] h-[1.5rem]" /></Button>
            <Button variant="danger" onClick={() => onDelete(r.id)}><Icon.trash className="w-[1.5rem] h-[1.5rem]" /></Button>
          </div>
        </Card>
      ))}
    </div>
  );
}

/* =========================================================================
   REGISTRO DIARIO DE ACTIVIDADES (no-pilotes: todo lo demás del contrato)
========================================================================= */
function emptyActivityLog(user, myProjects) {
  const p = myProjects[0];
  const act = p && p.actividades && p.actividades[0];
  return {
    id: "",
    proyectoId: p ? p.id : "",
    actividadId: act ? act.id : "",
    fecha: new Date().toISOString().slice(0, 10),
    cantidadEjecutada: "",
    observaciones: ""
  };
}

function ActivityLogForm({ user, projects, onSave, editing, onDoneEditing, showToast }) {
  const myProjects = projects.filter(p => (user.projectIds || []).includes(p.id) && (p.actividades || []).length > 0);
  const [form, setForm] = useState(() => editing || emptyActivityLog(user, myProjects));
  const [error, setError] = useState("");

  useEffect(() => { setForm(editing || emptyActivityLog(user, myProjects)); }, [editing]);

  const selectedProject = myProjects.find(p => p.id === form.proyectoId);
  const actividadesDisponibles = selectedProject ? (selectedProject.actividades || []) : [];
  const selectedActividad = actividadesDisponibles.find(a => a.id === form.actividadId);

  function updateProject(pid) {
    const p = myProjects.find(x => x.id === pid);
    const firstAct = p && p.actividades && p.actividades[0];
    setForm(prev => ({ ...prev, proyectoId: pid, actividadId: firstAct ? firstAct.id : "" }));
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setError("");
    if (!form.proyectoId || !form.actividadId) { setError("Selecciona un proyecto y una actividad."); return; }
    if (form.cantidadEjecutada === "" || parseFloat(form.cantidadEjecutada) < 0) { setError("Ingresa una cantidad ejecutada válida (no negativa)."); return; }
    const record = {
      id: form.id || fsNewId("avances"),
      proyectoId: form.proyectoId,
      actividadId: form.actividadId,
      actividadNombre: selectedActividad ? selectedActividad.nombre : "",
      unidad: selectedActividad ? selectedActividad.unidad : "",
      fecha: form.fecha,
      cantidadEjecutada: parseFloat(form.cantidadEjecutada) || 0,
      responsable: user.nombre + " " + user.apellidos,
      ingenieroId: user.id,
      observaciones: form.observaciones,
      createdAt: form.createdAt || Date.now()
    };
    await onSave(record);
    showToast(editing ? "Actividad actualizada" : "Actividad registrada");
    if (editing) {
      onDoneEditing();
    } else {
      setForm(prev => ({ ...emptyActivityLog(user, myProjects), proyectoId: prev.proyectoId, actividadId: prev.actividadId }));
    }
  }

  if (myProjects.length === 0) {
    return (
      <Card className="p-[4rem] text-center text-chp-grayLight max-w-[60rem] mx-auto">
        <p className="text-[1.5rem]">Ninguno de tus proyectos asignados tiene actividades contratadas cargadas todavía. Pide al coordinador que las agregue desde "Proyectos".</p>
      </Card>
    );
  }

  return (
    <Card className="p-[2rem] sm:p-[2.8rem] max-w-[62rem] mx-auto fade-slide">
      <SectionTitle>{editing ? "Editar actividad" : "Registrar actividad ejecutada"}</SectionTitle>
      <form onSubmit={handleSubmit}>
        <div className="grid sm:grid-cols-2 gap-x-[1.6rem]">
          <Field label="Proyecto" required>
            <SelectInput value={form.proyectoId} onChange={e => updateProject(e.target.value)}>
              {myProjects.map(p => <option key={p.id} value={p.id}>{p.nombre}</option>)}
            </SelectInput>
          </Field>
          <Field label="Actividad" required>
            <SelectInput value={form.actividadId} onChange={e => setForm({ ...form, actividadId: e.target.value })}>
              {actividadesDisponibles.map(a => <option key={a.id} value={a.id}>{a.nombre} ({a.unidad})</option>)}
            </SelectInput>
          </Field>
          <Field label="Fecha" required>
            <TextInput type="date" value={form.fecha} onChange={e => setForm({ ...form, fecha: e.target.value })} />
          </Field>
          <Field label={"Cantidad ejecutada" + (selectedActividad ? " (" + selectedActividad.unidad + ")" : "")} required>
            <TextInput type="number" min="0" step="0.01" value={form.cantidadEjecutada} onChange={e => setForm({ ...form, cantidadEjecutada: e.target.value })} />
          </Field>
        </div>
        <Field label="Observaciones">
          <TextArea value={form.observaciones} onChange={e => setForm({ ...form, observaciones: e.target.value })} placeholder="Novedades o detalles de la actividad ejecutada hoy..." />
        </Field>

        {error && (
          <div className="flex items-center gap-[0.8rem] text-red-600 bg-red-50 border border-red-200 rounded-[0.8rem] px-[1.4rem] py-[1rem] text-[1.3rem] mb-[1.4rem]">
            <Icon.alert className="w-[1.6rem] h-[1.6rem] shrink-0" /> {error}
          </div>
        )}

        <div className="flex justify-end gap-[1rem]">
          {editing && <Button type="button" variant="ghost" onClick={onDoneEditing}>Cancelar edición</Button>}
          <Button type="submit" variant="primary"><Icon.check className="w-[1.6rem] h-[1.6rem]" /> {editing ? "Guardar cambios" : "Registrar"}</Button>
        </div>
      </form>
    </Card>
  );
}

function KPICard({ label, value, tone }) {
  const tones = {
    blue: "text-chp-blue",
    green: "text-chp-greenDark",
    gray: "text-chp-gray"
  };
  return (

    </Card>

function BarChartCanvas({ labels, porcentajes, ejecutadosReales, programadosReales }) {
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(ref.current, {
      type: "bar",
      data: {
        labels,
        datasets: [
          {
            label: "% de avance",
            data: porcentajes,
            backgroundColor: porcentajes.map(p => p >= 100 ? "#8EC63F" : "#1A5276"),
            borderRadius: 5,
            maxBarThickness: 34
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const i = ctx.dataIndex;
                return [
                  "Avance: " + ctx.parsed.y + "%",
                  "Ejecutados: " + ejecutadosReales[i] + " / " + programadosReales[i] + " pilotes"
                ];
              }
            }
          }
        },
        scales: {
          x: { ticks: { font: { size: 10 } } },
          y: {
            beginAtZero: true,
            max: 100,
            ticks: { stepSize: 10, font: { size: 10 }, callback: (v) => v + "%" }
          }
        }
      }
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(labels), JSON.stringify(porcentajes)]);
  return <canvas ref={ref}></canvas>;
}

function LineChartCanvas({ labels, data }) {
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(ref.current, {
      type: "line",
      data: {
        labels,
        datasets: [{
          label: "% de expansión",
          data,
          borderColor: "#8EC63F",
          backgroundColor: "rgba(142,198,63,0.15)",
          tension: 0.35,
          fill: true,
          pointRadius: 2,
          pointBackgroundColor: "#6FA22B"
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { font: { size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 6 } },
          y: { ticks: { font: { size: 10 }, callback: v => v + "%" } }
        }
      }
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(labels), JSON.stringify(data)]);
  return <canvas ref={ref}></canvas>;
}

function Dashboard({ projects, reports, users }) {
  const [chartTab, setChartTab] = useState("avance");
  const now = new Date();
  const thisMonthReports = reports.filter(r => {
    const d = new Date(r.fecha + "T00:00:00");
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
  const oneWeekAgo = new Date(); oneWeekAgo.setDate(now.getDate() - 7);
  const thisWeekReports = reports.filter(r => new Date(r.fecha + "T00:00:00") >= oneWeekAgo);

  const volumenTotal = round(reports.reduce((s, r) => s + (r.volReal || 0), 0), 2);
  const expansionProm = reports.length ? round(reports.reduce((s, r) => s + (r.porcentajeExpansion || 0), 0) / reports.length, 2) : 0;

  const barLabels = projects.map(p => (p.nombre || "Sin nombre").length > 18 ? (p.nombre || "Sin nombre").slice(0, 16) + "…" : (p.nombre || "Sin nombre"));
  const barEjecutadosReales = projects.map(p => reports.filter(r => r.proyectoId === p.id).length);
  const barProgramadosReales = projects.map(p => p.pilotesProgramados || 0);
  const barPorcentajes = projects.map((p, i) => p.pilotesProgramados ? Math.round((barEjecutadosReales[i] / p.pilotesProgramados) * 100) : 0);

  const sortedByDate = [...reports].sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
  const lineLabels = sortedByDate.map(r => fmtFecha(r.fecha));
  const lineData = sortedByDate.map(r => r.porcentajeExpansion || 0);

  return (
    <div className="grid gap-[1.4rem] sm:gap-[2rem]">
      <MachineShowcase />
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-[1rem] sm:gap-[1.6rem]">
        <KPICard label="Pilotes (mes)" value={thisMonthReports.length} tone="blue" />
        <KPICard label="Pilotes (semana)" value={thisWeekReports.length} tone="blue" />
        <KPICard label="Concreto total" value={volumenTotal + " m³"} tone="green" />
        <KPICard label="Expansión prom." value={expansionProm + "%"} tone="gray" />
      </div>

      <Card className="p-[1.4rem] sm:p-[2rem]">
        <div className="flex items-center justify-between flex-wrap gap-[0.8rem] mb-[1rem]">
          <p className="text-[1.4rem] sm:text-[1.5rem] font-bold text-chp-blue">
            {chartTab === "avance" ? "Avance de pilotes por obra" : "Tendencia del % de expansión"}
          </p>
          <SegmentToggle
            value={chartTab}
            onChange={setChartTab}
            options={[{ value: "avance", label: "Avance" }, { value: "expansion", label: "Expansión" }]}
          />
        </div>
        <div className="h-[15rem] sm:h-[20rem]">
          {chartTab === "avance"
            ? (projects.length ? <BarChartCanvas labels={barLabels} porcentajes={barPorcentajes} ejecutadosReales={barEjecutadosReales} programadosReales={barProgramadosReales} /> : <EmptyChart />)
            : (reports.length ? <LineChartCanvas labels={lineLabels} data={lineData} /> : <EmptyChart />)}
        </div>
      </Card>
    </div>
  );
}
function EmptyChart() {
  return <div className="h-full flex items-center justify-center text-chp-grayLight text-[1.3rem]">Aún no hay datos suficientes.</div>;
}

              <Card key={p.id} className="p-[2rem]">
                <p className="font-bold text-[1.6rem] mb-[1.4rem]">{p.nombre}</p>
                <div className="grid gap-[1.2rem]">
                  {(p.actividades || []).map(a => {
                    const ejec = avances.filter(av => av.proyectoId === p.id && av.actividadId === a.id).reduce((s, av) => s + (av.cantidadEjecutada || 0), 0);
                    const pct = a.cantidadContratada ? Math.min(100, round((ejec / a.cantidadContratada) * 100, 0)) : 0;
                    return (
                      <div key={a.id}>
                        <div className="flex justify-between text-[1.3rem] mb-[0.4rem]">
                          <span className="font-medium">{a.nombre}</span>
                          <span className="text-chp-grayLight">{round(ejec,2)} / {a.cantidadContratada} {a.unidad} · {pct}%</span>
                        </div>
                        <div className="h-[0.8rem] bg-gray-100 rounded-full overflow-hidden">
                          <div className={"h-full rounded-full " + (pct >= 100 ? "bg-chp-blue" : "bg-chp-green")} style={{ width: pct + "%" }}></div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </Card>
            ))}
          </div>
        )}
      </div>

      <div>
        <h2 className="text-[1.9rem] font-bold text-chp-blue mb-[1.4rem]">Registros diarios de actividades</h2>
        <div className="flex flex-wrap items-end gap-[1.2rem] mb-[1.8rem]">
          <Field label="Proyecto">
            <SelectInput value={filterProject} onChange={e => setFilterProject(e.target.value)} className="min-w-[20rem]">
              <option value="">Todos</option>
              {projects.map(p => <option key={p.id} value={p.id}>{p.nombre}</option>)}
            </SelectInput>
          </Field>
          <Field label="Ingeniero">
            <SelectInput value={filterEngineer} onChange={e => setFilterEngineer(e.target.value)} className="min-w-[18rem]">
              <option value="">Todos</option>
              {engineers.map(u => <option key={u.id} value={u.id}>{u.nombre} {u.apellidos}</option>)}
            </SelectInput>
          </Field>
          <Field label="Fecha">
            <TextInput type="date" value={filterDate} onChange={e => setFilterDate(e.target.value)} />
          </Field>
          <Button variant="secondary" onClick={exportCSV} className="mb-[1.6rem]"><Icon.download className="w-[1.5rem] h-[1.5rem]" /> Exportar CSV</Button>
        </div>

        <Card className="overflow-x-auto">
          <table className="w-full text-[1.3rem] min-w-[90rem]">
            <thead>
              <tr className="bg-chp-bg text-chp-grayLight uppercase text-[1.1rem] tracking-wide">
                <Th>Fecha</Th><Th>Proyecto</Th><Th>Actividad</Th><Th>Cantidad</Th><Th>Ingeniero</Th><Th>Observaciones</Th><Th></Th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(a => (
                <tr key={a.id} className="border-t border-gray-100 hover:bg-chp-bg/60">
                  <Td>{fmtFecha(a.fecha)}</Td>
                  <Td>{projectName(a.proyectoId)}</Td>
                  <Td className="font-semibold">{a.actividadNombre}</Td>
                  <Td>{a.cantidadEjecutada} {a.unidad}</Td>
                  <Td>{engineerName(a.ingenieroId)}</Td>
                  <Td className="max-w-[24rem] truncate">{a.observaciones}</Td>
                  <Td>
                    <div className="flex gap-[0.8rem]">
                      <button onClick={() => setViewingActivity(a)} title="Ver detalle completo" className="text-chp-grayLight hover:text-chp-blue p-[0.6rem] -m-[0.6rem]">
                        <Icon.eye className="w-[1.5rem] h-[1.5rem]" />
                      </button>
                      <button onClick={() => onDelete(a.id)} className="text-chp-grayLight hover:text-red-600 p-[0.6rem] -m-[0.6rem]">
                        <Icon.trash className="w-[1.5rem] h-[1.5rem]" />
                      </button>
                    </div>
                  </Td>
                </tr>
              ))}
              {filtered.length === 0 && (
                <tr><td colSpan="7" className="text-center py-[3rem] text-chp-grayLight">No hay registros con estos filtros.</td></tr>
              )}
            </tbody>
          </table>
        </Card>
      </div>
      {viewingActivity && (
        <ActivityDetailModal avance={viewingActivity} projectName={projectName} engineerName={engineerName} onClose={() => setViewingActivity(null)} />
      )}
    </div>
  );
}

/* =========================================================================
   GESTIÓN DE PROYECTOS (incluye catálogo de actividades contratadas)
========================================================================= */
function emptyProjectForm() {
  return { nombre: "", contratante: "", pilotesProgramados: "", actividades: [] };
}

function ProjectsManager({ projects, reports, avances, showToast }) {
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState(emptyProjectForm());
  const [saving, setSaving] = useState(false);
  const [expanded, setExpanded] = useState({});

  function startNew() { setEditing("new"); setForm(emptyProjectForm()); }
  function startEdit(p) {
    setEditing(p.id);
    setForm({
      nombre: p.nombre,
      contratante: p.contratante,
      pilotesProgramados: p.pilotesProgramados,
      actividades: (p.actividades || []).map(a => ({ ...a }))
    });
  }

  function addActividadRow() {
    setForm(prev => ({
      ...prev,
      actividades: [...prev.actividades, { id: uid("act"), nombre: "", unidad: UNIDADES_ACTIVIDAD[0], cantidadContratada: "" }]
    }));
  }
  function updateActividadRow(idx, field, value) {
    setForm(prev => {
      const next = [...prev.actividades];
      next[idx] = { ...next[idx], [field]: value };
      return { ...prev, actividades: next };
    });
  }
  function removeActividadRow(idx) {
    setForm(prev => ({ ...prev, actividades: prev.actividades.filter((_, i) => i !== idx) }));
  }

  async function save() {
    if (!form.nombre.trim()) return;
    setSaving(true);
    const id = editing === "new" ? fsNewId("proyectos") : editing;
    const actividadesLimpias = form.actividades
      .filter(a => a.nombre.trim())
      .map(a => ({
        id: a.id || uid("act"),
        nombre: a.nombre.trim(),
        unidad: a.unidad || "un",
        cantidadContratada: parseFloat(a.cantidadContratada) || 0
      }));
    await fsSet("proyectos", id, {
      nombre: form.nombre,
      contratante: form.contratante,
      pilotesProgramados: parseInt(form.pilotesProgramados) || 0,
      actividades: actividadesLimpias
    });
    showToast(editing === "new" ? "Proyecto creado" : "Proyecto actualizado");
    setSaving(false);
    setEditing(null);
  }
  async function remove(id) {
    if (reports.some(r => r.proyectoId === id) || avances.some(a => a.proyectoId === id)) {
      alert("No puedes eliminar un proyecto con reportes o avances registrados.");
      return;
    }
    if (!confirm("¿Eliminar este proyecto?")) return;
    await fsDelete("proyectos", id);
  }

  return (
    <div className="grid gap-[1.6rem]">
      <div className="flex justify-between items-center">
        <h2 className="text-[1.9rem] font-bold text-chp-blue">Proyectos</h2>
        <Button variant="secondary" onClick={startNew}><Icon.plus className="w-[1.5rem] h-[1.5rem]" /> Nuevo proyecto</Button>
      </div>

      {editing && (
        <Card className="p-[2rem] fade-slide">
          <div className="grid sm:grid-cols-3 gap-x-[1.6rem]">
            <Field label="Nombre del proyecto" required>
              <TextInput value={form.nombre} onChange={e => setForm({ ...form, nombre: e.target.value })} />
            </Field>
            <Field label="Contratante">
              <TextInput value={form.contratante} onChange={e => setForm({ ...form, contratante: e.target.value })} />
            </Field>
            <Field label="Pilotes programados">
              <TextInput type="number" min="0" value={form.pilotesProgramados} onChange={e => setForm({ ...form, pilotesProgramados: e.target.value })} />
            </Field>
          </div>

          <div className="border-t border-gray-100 pt-[1.6rem] mt-[0.4rem]">
            <div className="flex items-center justify-between mb-[1.2rem]">
              <div>
                <p className="text-[1.4rem] font-bold text-chp-blue">Actividades contratadas</p>
                <p className="text-[1.2rem] text-chp-grayLight">Todo lo demás del contrato: excavaciones, concretos no estructurales, demoliciones, transporte, etc.</p>
              </div>
              <Button variant="ghost" type="button" onClick={addActividadRow}><Icon.plus className="w-[1.4rem] h-[1.4rem]" /> Agregar actividad</Button>
            </div>

            {form.actividades.length === 0 && (
              <p className="text-[1.3rem] text-chp-grayLight italic mb-[1rem]">Aún no has agregado actividades contratadas para este proyecto.</p>
            )}

            <div className="grid gap-[1rem]">
              {form.actividades.map((a, idx) => (
                <div key={a.id || idx} className="grid grid-cols-[1fr_10rem_10rem_auto] gap-[0.8rem] items-end bg-chp-bg rounded-[0.8rem] p-[1.2rem]">
                  <Field label="Actividad">
                    <TextInput value={a.nombre} onChange={e => updateActividadRow(idx, "nombre", e.target.value)} placeholder="Ej: Excavación manual" className="bg-white" />
                  </Field>
                  <Field label="Unidad">
                    <SelectInput value={a.unidad} onChange={e => updateActividadRow(idx, "unidad", e.target.value)} className="bg-white">
                      {UNIDADES_ACTIVIDAD.map(u => <option key={u} value={u}>{u}</option>)}
                    </SelectInput>
                  </Field>
                  <Field label="Cant. contratada">
                    <TextInput type="number" min="0" value={a.cantidadContratada} onChange={e => updateActividadRow(idx, "cantidadContratada", e.target.value)} className="bg-white" />
                  </Field>
                  <button type="button" onClick={() => removeActividadRow(idx)} className="mb-[1.6rem] w-[3.6rem] h-[3.6rem] rounded-[0.8rem] border border-gray-200 bg-white flex items-center justify-center text-chp-grayLight hover:text-red-600 hover:border-red-200">
                    <Icon.trash className="w-[1.5rem] h-[1.5rem]" />
                  </button>
                </div>
              ))}
            </div>
          </div>

          <div className="flex gap-[1rem] mt-[1.6rem]">
            <Button variant="primary" onClick={save} disabled={saving}>{saving ? "Guardando..." : "Guardar"}</Button>
            <Button variant="ghost" onClick={() => setEditing(null)}>Cancelar</Button>
          </div>
        </Card>
      )}

      <div className="grid sm:grid-cols-2 gap-[1.2rem]">
        {projects.map(p => {
          const ejecutados = reports.filter(r => r.proyectoId === p.id).length;
          const actividades = p.actividades || [];
          const isExpanded = expanded[p.id];
          return (
            <Card key={p.id} className="p-[1.8rem]">
              <div className="flex justify-between items-start">
                <div>
                  <p className="font-bold text-[1.6rem]">{p.nombre}</p>
                  <p className="text-[1.3rem] text-chp-grayLight">{p.contratante || "Sin contratante"}</p>
                </div>
                <div className="flex gap-[0.6rem]">
                  <button onClick={() => startEdit(p)} className="text-chp-grayLight hover:text-chp-blue p-[0.6rem] -m-[0.6rem]"><Icon.edit className="w-[1.6rem] h-[1.6rem]" /></button>
                  <button onClick={() => remove(p.id)} className="text-chp-grayLight hover:text-red-600 p-[0.6rem] -m-[0.6rem]"><Icon.trash className="w-[1.6rem] h-[1.6rem]" /></button>
                </div>
              </div>
              <div className="mt-[1.2rem] flex items-center gap-[1rem] flex-wrap">
                <Badge tone="blue">{ejecutados} / {p.pilotesProgramados || 0} pilotes</Badge>
                {actividades.length > 0 && <Badge tone="green">{actividades.length} actividad{actividades.length !== 1 ? "es" : ""} contratada{actividades.length !== 1 ? "s" : ""}</Badge>}
              </div>
              {actividades.length > 0 && (
                <div className="mt-[1.2rem]">
                  <button onClick={() => setExpanded(prev => ({ ...prev, [p.id]: !prev[p.id] }))} className="flex items-center gap-[0.5rem] text-[1.25rem] font-semibold text-chp-blue">
                    {isExpanded ? <Icon.chevronDown className="w-[1.4rem] h-[1.4rem]" /> : <Icon.chevronRight className="w-[1.4rem] h-[1.4rem]" />}
                    Ver actividades contratadas
                  </button>
                  {isExpanded && (
                    <div className="mt-[1rem] grid gap-[0.6rem]">
                      {actividades.map(a => {
                        const ejec = avances.filter(av => av.proyectoId === p.id && av.actividadId === a.id).reduce((s, av) => s + (av.cantidadEjecutada || 0), 0);
                        const pct = a.cantidadContratada ? Math.min(100, round((ejec / a.cantidadContratada) * 100, 0)) : 0;
                        return (
                          <div key={a.id} className="text-[1.25rem]">
                            <div className="flex justify-between mb-[0.3rem]">
                              <span>{a.nombre}</span>
                              <span className="text-chp-grayLight">{round(ejec,2)} / {a.cantidadContratada} {a.unidad}</span>
                            </div>
                            <div className="h-[0.6rem] bg-gray-100 rounded-full overflow-hidden">
                              <div className="h-full bg-chp-green rounded-full" style={{ width: pct + "%" }}></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
            </Card>
          );
        })}
      </div>
    </div>
  );
}

/* =========================================================================
   GESTIÓN DE USUARIOS (contraseñas individuales)
========================================================================= */
function UsersManager({ users, projects, currentUser, showToast }) {
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState(emptyUserFormFn());
  const [saving, setSaving] = useState(false);
  const [formError, setFormError] = useState("");

  function emptyUserFormFn() {
    return { email: "", nombre: "", apellidos: "", role: "ingeniero", password: "", projectIds: [] };
  }
  function startNew() { setEditing("new"); setForm(emptyUserFormFn()); setFormError(""); }
  function startEdit(u) { setEditing(u.id); setForm({ email: u.email || "", nombre: u.nombre, apellidos: u.apellidos, role: u.role, password: "", projectIds: u.projectIds || [] }); setFormError(""); }

  function toggleProject(id) {
    setForm(prev => ({
      ...prev,
      projectIds: prev.projectIds.includes(id) ? prev.projectIds.filter(x => x !== id) : [...prev.projectIds, id]
    }));
  }

  async function save() {
    setFormError("");
    if (!form.nombre.trim() || !form.email.trim()) {
      setFormError("Nombre y correo electrónico son obligatorios.");
      return;
    }
    setSaving(true);
    try {
      if (editing === "new") {
        if (!form.password.trim() || form.password.length < 6) {
          setFormError("La contraseña debe tener al menos 6 caracteres.");
          setSaving(false);
          return;
        }
        const newUid = await createAuthUserKeepingSession(form.email.trim(), form.password);
        await fsSet("usuarios", newUid, {
          email: form.email.trim(),
          nombre: form.nombre,
          apellidos: form.apellidos,
          role: form.role,
          projectIds: form.projectIds
        });
        showToast("Usuario creado con su propia contraseña");
      } else {
        await fsSet("usuarios", editing, {
          nombre: form.nombre,
          apellidos: form.apellidos,
          role: form.role,
          projectIds: form.projectIds
        });
        showToast("Usuario actualizado");
      }
      setEditing(null);
    } catch (err) {
      const map = {
        "auth/email-already-in-use": "Ese correo ya está registrado.",
        "auth/invalid-email": "El correo electrónico no es válido.",
        "auth/weak-password": "La contraseña es demasiado débil."
      };
      setFormError(map[err.code] || ("No se pudo guardar: " + err.message));
    }
    setSaving(false);
  }

  async function sendReset(u) {
    try {
      await fbAuth.sendPasswordResetEmail(u.email);
      showToast("Correo de restablecimiento enviado a " + u.email);
    } catch (err) {
      alert("No se pudo enviar el correo: " + err.message);
    }
  }

  async function remove(id) {
    if (id === currentUser.id) { alert("No puedes eliminar tu propio usuario mientras tienes la sesión iniciada."); return; }
    if (!confirm("Esto elimina el perfil del usuario (pierde acceso a la app). La cuenta de acceso deberá eliminarse aparte desde la consola de Firebase. ¿Continuar?")) return;
    await fsDelete("usuarios", id);
  }

  return (
    <div className="grid gap-[1.6rem]">
      <div className="flex justify-between items-center">
        <h2 className="text-[1.9rem] font-bold text-chp-blue">Usuarios</h2>
        <Button variant="secondary" onClick={startNew}><Icon.plus className="w-[1.5rem] h-[1.5rem]" /> Nuevo usuario</Button>
      </div>

      {editing && (
        <Card className="p-[2rem] fade-slide">
          <div className="grid sm:grid-cols-2 gap-x-[1.6rem]">
            <Field label="Nombre" required><TextInput value={form.nombre} onChange={e => setForm({ ...form, nombre: e.target.value })} /></Field>
            <Field label="Apellidos" required><TextInput value={form.apellidos} onChange={e => setForm({ ...form, apellidos: e.target.value })} /></Field>
            <Field label="Correo electrónico" required hint={editing !== "new" ? "No se puede cambiar aquí" : "Será su usuario de acceso"}>
              <TextInput type="email" value={form.email} disabled={editing !== "new"} onChange={e => setForm({ ...form, email: e.target.value })} className={editing !== "new" ? "bg-gray-50 text-chp-grayLight" : ""} />
            </Field>
            {editing === "new" && (
              <Field label="Contraseña" required hint="Mínimo 6 caracteres. El usuario podrá cambiarla luego.">
                <TextInput type="text" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })} />
              </Field>
            )}
            <Field label="Rol">
              <SelectInput value={form.role} onChange={e => setForm({ ...form, role: e.target.value })}>
                <option value="ingeniero">Ingeniero de Obra</option>
                <option value="coordinador">Coordinador de Proyectos</option>
              </SelectInput>
            </Field>
          </div>
          {form.role === "ingeniero" && (
            <Field label="Proyectos asignados">
              <div className="flex flex-wrap gap-[0.8rem]">
                {projects.map(p => (
                  <button
                    type="button"
                    key={p.id}
                    onClick={() => toggleProject(p.id)}
                    className={"px-[1.4rem] py-[0.8rem] rounded-full text-[1.25rem] font-semibold border-[0.15rem] transition-all " +
                      (form.projectIds.includes(p.id) ? "bg-chp-blue text-white border-chp-blue" : "bg-white text-chp-grayLight border-gray-200")}
                  >
                    {p.nombre}
                  </button>
                ))}
              </div>
            </Field>
          )}
          {formError && (
            <div className="flex items-center gap-[0.8rem] text-red-600 bg-red-50 border border-red-200 rounded-[0.8rem] px-[1.4rem] py-[1rem] text-[1.3rem] mb-[1.2rem]">
              <Icon.alert className="w-[1.6rem] h-[1.6rem] shrink-0" /> {formError}
            </div>
          )}
          <div className="flex gap-[1rem] mt-[0.8rem]">
            <Button variant="primary" onClick={save} disabled={saving}>{saving ? "Guardando..." : "Guardar"}</Button>
            <Button variant="ghost" onClick={() => setEditing(null)}>Cancelar</Button>
          </div>
        </Card>
      )}

      <div className="grid sm:grid-cols-2 gap-[1.2rem]">
        {users.map(u => (
          <Card key={u.id} className="p-[1.8rem]">
            <div className="flex justify-between items-start">
              <div>
                <p className="font-bold text-[1.6rem]">{u.nombre} {u.apellidos}</p>
                <p className="text-[1.3rem] text-chp-grayLight">{u.email} · {u.role === "coordinador" ? "Coordinador de Proyectos" : "Ingeniero de Obra"}</p>
              </div>
              <div className="flex gap-[0.6rem]">
                <button onClick={() => sendReset(u)} title="Enviar restablecimiento de contraseña" className="text-chp-grayLight hover:text-chp-blue p-[0.6rem] -m-[0.6rem]"><Icon.lock className="w-[1.6rem] h-[1.6rem]" /></button>
                <button onClick={() => startEdit(u)} className="text-chp-grayLight hover:text-chp-blue p-[0.6rem] -m-[0.6rem]"><Icon.edit className="w-[1.6rem] h-[1.6rem]" /></button>
                <button onClick={() => remove(u.id)} className="text-chp-grayLight hover:text-red-600 p-[0.6rem] -m-[0.6rem]"><Icon.trash className="w-[1.6rem] h-[1.6rem]" /></button>
              </div>
            </div>
            {u.role === "ingeniero" && (
              <div className="mt-[1rem] flex flex-wrap gap-[0.6rem]">
                {(u.projectIds || []).map(pid => {
                  const p = projects.find(x => x.id === pid);
                  return p ? <Badge key={pid} tone="blue">{p.nombre}</Badge> : null;
                })}
                {(u.projectIds || []).length === 0 && <span className="text-[1.2rem] text-chp-grayLight">Sin proyectos asignados</span>}
              </div>
            )}
          </Card>
        ))}
      </div>
    </div>
  );
}

        <h1 className="text-[2rem] font-bold text-chp-blue mb-[1rem]">Cuenta sin perfil configurado</h1>

function ProfileErrorScreen({ email, message, onLogout }) {
  return (
    <div className="min-h-screen flex items-center justify-center px-[2rem]">
      <Card className="p-[3.2rem] max-w-[54rem] text-center">
        <Icon.alert className="w-[4rem] h-[4rem] text-red-500 mx-auto mb-[1.6rem]" />
        <h1 className="text-[2rem] font-bold text-red-600 mb-[1rem]">No se pudo cargar tu perfil</h1>
        <p className="text-[1.4rem] text-chp-grayLight mb-[1.6rem]">
