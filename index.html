          Esto casi siempre significa que las reglas de seguridad de Firestore no están publicadas,
          o que hay un error de escritura en ellas.
        </p>
        <p className="text-[1.2rem] text-left bg-gray-50 rounded-[0.8rem] p-[1.4rem] font-mono text-red-700 mb-[2rem] overflow-x-auto">
          {message}
        </p>
        <Button variant="secondary" onClick={onLogout}>Cerrar sesión</Button>
      </Card>
    </div>
  );
}


/* =========================================================================
   DOCUMENTOS DE OBRA — Storage + Firestore
   El coordinador carga/elimina. Los ingenieros solo consultan/descargan
   los documentos de los proyectos que tienen asignados.
========================================================================= */
const DOCUMENT_ACCEPT = ".pdf,.jpg,.jpeg,.png,.webp,.txt,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv";
function formatBytes(bytes) {
  if (!bytes) return "0 KB";
  const units = ["B", "KB", "MB", "GB"];
  const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
  return `${round(bytes / Math.pow(1024, i), i ? 1 : 0)} ${units[i]}`;
}
function fileKind(name, type) {
  const ext = (name || "").split(".").pop().toLowerCase();
  if (type === "application/pdf" || ext === "pdf") return "PDF";
  if (["jpg","jpeg","png","webp"].includes(ext)) return "IMAGEN";
  if (["doc","docx"].includes(ext)) return "WORD";
  if (["xls","xlsx","csv"].includes(ext)) return "EXCEL";
  if (["ppt","pptx"].includes(ext)) return "PPT";
  if (ext === "txt") return "TXT";
  return ext.toUpperCase() || "ARCHIVO";
}
function DocumentsView({ user, projects, documents, onUpload, onDelete, showToast }) {
  const isCoord = user.role === "coordinador";
  const visibleProjects = isCoord ? projects : projects.filter(p => (user.projectIds || []).includes(p.id));
  const [selectedProjectId, setSelectedProjectId] = useState(visibleProjects[0]?.id || "");
  const [uploading, setUploading] = useState(false);
  const [progress, setProgress] = useState(0);
  const inputRef = useRef(null);
  const [filter, setFilter] = useState("");

  useEffect(() => {
    if (!visibleProjects.some(p => p.id === selectedProjectId)) setSelectedProjectId(visibleProjects[0]?.id || "");
  }, [projects, user.projectIds, selectedProjectId]);

  const selectedProject = visibleProjects.find(p => p.id === selectedProjectId);
  const projectDocs = documents
    .filter(d => d.projectId === selectedProjectId)
    .filter(d => !filter || d.name.toLowerCase().includes(filter.toLowerCase()));

  async function handleFiles(e) {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (!files.length || !selectedProjectId || !isCoord) return;
    const tooLarge = files.find(f => f.size > 25 * 1024 * 1024);
    if (tooLarge) { showToast(`El archivo ${tooLarge.name} supera el límite de 25 MB.`); return; }
    setUploading(true); setProgress(0);
    try {
      for (let i = 0; i < files.length; i++) {
        setProgress(0);
        await onUpload(files[i], selectedProjectId, pct => setProgress(Math.round((i * 100 + pct) / files.length)));
      }
      showToast(files.length === 1 ? "Documento cargado correctamente." : `${files.length} documentos cargados correctamente.`);
    } catch (err) {
      console.error(err);
      showToast("No se pudo cargar uno de los documentos. Revisa Storage y las reglas de seguridad.");
    } finally { setUploading(false); setProgress(0); }
  }

  return (
    <div className="fade-slide relative z-[1]">
      <div className="chp-hero rounded-[1.6rem] p-[2rem] sm:p-[2.6rem] mb-[1.8rem] text-white shadow-sm">
        <div className="flex items-center justify-between gap-[1.5rem]">
          <div>
            <div className="flex items-center gap-[.8rem] text-[1.1rem] uppercase tracking-widest opacity-80 font-bold mb-[.6rem]"><Icon.building className="w-[1.5rem] h-[1.5rem]"/> Gestión documental de obra</div>
            <h1 className="text-[2.2rem] sm:text-[2.8rem] font-extrabold">Documentos de Obra</h1>
            <p className="text-[1.3rem] sm:text-[1.4rem] opacity-90 mt-[.6rem] max-w-[70rem]">Procedimientos, contratos, SST, permisos de trabajo, ATS y demás documentos asociados a cada proyecto.</p>
          </div>
          <div className="hidden sm:block opacity-80 machine-card"><Icon.machine className="w-[11rem] h-[11rem]"/></div>
        </div>
      </div>

      {visibleProjects.length === 0 ? (
        <Card><div className="py-[3rem] text-center text-chp-grayLight"><Icon.file className="w-[4rem] h-[4rem] mx-auto mb-[1rem]"/><p>No tienes proyectos asignados para consultar documentos.</p></div></Card>
      ) : (
        <>
          <Card className="mb-[1.6rem]">
            <div className="flex flex-col sm:flex-row sm:items-end gap-[1.2rem]">
              <div className="flex-1"><Field label="Obra / Proyecto"><SelectInput value={selectedProjectId} onChange={e => setSelectedProjectId(e.target.value)}>{visibleProjects.map(p => <option key={p.id} value={p.id}>{p.nombre}</option>)}</SelectInput></Field></div>
              <div className="flex-1"><Field label="Buscar documento"><TextInput value={filter} onChange={e => setFilter(e.target.value)} placeholder="Ej. procedimiento, ATS, contrato..." /></Field></div>
              {isCoord && <div className="sm:pb-[1.6rem]"><Button variant="secondary" onClick={() => inputRef.current?.click()} disabled={uploading}><Icon.upload className="w-[1.7rem] h-[1.7rem]"/>{uploading ? `Cargando ${progress}%` : "Adjuntar documentos"}</Button><input ref={inputRef} type="file" multiple accept={DOCUMENT_ACCEPT} className="hidden" onChange={handleFiles}/></div>}
            </div>
            {isCoord && <p className="text-[1.15rem] text-chp-grayLight -mt-[.4rem]">Formatos: PDF, JPG/PNG, TXT, Word, Excel, PowerPoint y CSV. Máximo 25 MB por archivo.</p>}
          </Card>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-[1.2rem]">
            {projectDocs.map(doc => (
              <div key={doc.id} className="doc-card bg-white border border-gray-100 rounded-[1.2rem] p-[1.5rem] flex flex-col gap-[1rem]">
                <div className="flex items-start justify-between gap-[1rem]"><div className="w-[4.2rem] h-[4.2rem] rounded-[1rem] bg-chp-bg text-chp-blue flex items-center justify-center shrink-0"><Icon.file className="w-[2.1rem] h-[2.1rem]"/></div><span className="text-[1rem] font-bold px-[.7rem] py-[.35rem] rounded-full bg-chp-bg text-chp-blue">{fileKind(doc.name, doc.contentType)}</span></div>
                <div className="min-w-0"><h3 className="font-bold text-[1.4rem] break-words">{doc.name}</h3><p className="text-[1.1rem] text-chp-grayLight mt-[.4rem]">{formatBytes(doc.size)} · {fmtFechaHora(doc.uploadedAt)}</p></div>
                <div className="mt-auto flex gap-[.7rem]"><button onClick={async () => { try { await openDocumentFile(doc); } catch(e) { console.error(e); showToast("No se pudo abrir/descargar el archivo. Si es la primera configuración, revisaremos CORS de Storage."); } }} className="flex-1 inline-flex items-center justify-center gap-[.6rem] rounded-[.8rem] bg-chp-blue text-white px-[1rem] py-[.9rem] text-[1.2rem] font-semibold"><Icon.download className="w-[1.6rem] h-[1.6rem]"/> Ver / descargar</button>{isCoord && <button onClick={async () => { if (!confirm(`¿Eliminar ${doc.name}?`)) return; try { await onDelete(doc); showToast("Documento eliminado."); } catch(e) { console.error(e); showToast("No se pudo eliminar el documento."); } }} className="w-[4.2rem] rounded-[.8rem] border border-red-100 text-red-500 flex items-center justify-center" title="Eliminar"><Icon.trash className="w-[1.7rem] h-[1.7rem]"/></button>}</div>
              </div>
            ))}
          </div>
          {projectDocs.length === 0 && <Card className="mt-[1.2rem]"><div className="py-[2.5rem] text-center text-chp-grayLight"><Icon.file className="w-[3.4rem] h-[3.4rem] mx-auto mb-[.8rem]"/><p>No hay documentos para esta obra{filter ? " que coincidan con la búsqueda" : " todavía"}.</p>{isCoord && <p className="text-[1.2rem] mt-[.5rem]">Usa “Adjuntar documentos” para cargar el primer archivo.</p>}</div></Card>}
        </>
      )}
    </div>
  );
}

function App() {
  const [authReady, setAuthReady] = useState(false);
  const [firebaseUser, setFirebaseUser] = useState(null);
  const [profile, setProfile] = useState(null);
  const [profileReady, setProfileReady] = useState(false);
  const [profileError, setProfileError] = useState(null);

  const [users, setUsers] = useState([]);
  const [projects, setProjects] = useState([]);
  const [reports, setReports] = useState([]);
  const [avances, setAvances] = useState([]);
  const [documents, setDocuments] = useState([]);

  const [view, setView] = useState(null);
  const [editingReport, setEditingReport] = useState(null);
  const [editingActivity, setEditingActivity] = useState(null);
  const [toast, setToast] = useState("");

  function showToast(msg) { setToast(""); setTimeout(() => setToast(msg), 10); }

  // Estado de autenticación de Firebase
  useEffect(() => {
    const unsub = fbAuth.onAuthStateChanged(u => {
      setFirebaseUser(u);
      setAuthReady(true);
      if (!u) { setProfile(null); setProfileReady(true); setView(null); }
    });
    return unsub;
  }, []);

  // Perfil del usuario autenticado (colección "usuarios", doc id = uid)
  useEffect(() => {
    if (!firebaseUser) return;
    setProfileReady(false);
    setProfileError(null);
    const unsub = fsSubscribeDoc(
      "usuarios",
      firebaseUser.uid,
      doc => {
        setProfile(doc);
        setProfileReady(true);
      },
      err => {
        console.error("Error cargando el perfil:", err);
        setProfileError(err.message || String(err));
        setProfileReady(true);
      }
    );
    return unsub;
  }, [firebaseUser]);

  // Colecciones compartidas en tiempo real — solo una vez hay sesión activa
  useEffect(() => {
    if (!firebaseUser) return;
    const unsubUsers = fsSubscribe("usuarios", setUsers);
    const unsubProjects = fsSubscribe("proyectos", setProjects);
    const unsubReports = fsSubscribe("reportes", setReports);
    const unsubAvances = fsSubscribe("avances", setAvances);
    const unsubDocuments = fsSubscribe("documentosObra", setDocuments);
    return () => { unsubUsers(); unsubProjects(); unsubReports(); unsubAvances(); unsubDocuments(); };
  }, [firebaseUser]);

  const currentUser = profile ? { id: firebaseUser.uid, uid: firebaseUser.uid, email: firebaseUser.email, ...profile } : null;

  useEffect(() => {
    if (currentUser && !view) {
      setView(currentUser.role === "coordinador" ? "dashboard" : "nuevo");
    }
  }, [currentUser]);

  function handleLogout() {
    fbAuth.signOut();
  }

  async function saveReport(record) {
    const id = record.id || fsNewId("reportes");
    await fsSet("reportes", id, { ...record, id });
    setEditingReport(null);
  }
  async function deleteReport(id) {
    if (!confirm("¿Eliminar este reporte de forma permanente?")) return;
    await fsDelete("reportes", id);
  }
  async function saveActivityLog(record) {
    await fsSet("avances", record.id, record);
    setEditingActivity(null);
  }
  async function deleteActivityLog(id) {
    if (!confirm("¿Eliminar este registro de actividad de forma permanente?")) return;
    await fsDelete("avances", id);
  }
  async function saveDocumentFile(file, projectId, onProgress) {
    if (currentUser.role !== "coordinador") throw new Error("Solo el coordinador puede cargar documentos.");
    return uploadDocumentFile(file, projectId, currentUser, onProgress);
  }
  async function removeDocumentFile(doc) {
    if (currentUser.role !== "coordinador") throw new Error("Solo el coordinador puede eliminar documentos.");
    return deleteDocumentFile(doc);
  }

  if (!authReady) return <LoadingScreen label="Cargando..." />;
  if (!firebaseUser) return <LoginScreen />;
  if (!profileReady) return <LoadingScreen label="Cargando tu perfil..." />;
  if (profileError) return <ProfileErrorScreen email={firebaseUser.email} message={profileError} onLogout={handleLogout} />;
  if (!profile) return <NoProfileScreen email={firebaseUser.email} onLogout={handleLogout} />;

  const isCoord = currentUser.role === "coordinador";

  return (
    <div className="min-h-screen relative overflow-x-hidden">
      <div className="chp-watermark"><Icon.machine className="w-full h-full" /></div>
      <Header user={currentUser} onLogout={handleLogout} view={view} setView={(v) => { setEditingReport(null); setEditingActivity(null); setView(v); }} />
      <main className="max-w-[130rem] mx-auto px-[1.4rem] sm:px-[2.4rem] py-[1.6rem] sm:py-[2.4rem]">
        {!isCoord && view === "nuevo" && (
          <NuevoRegistroView
            user={currentUser}
            projects={projects}
            reports={reports}
            editingReport={editingReport}
            onSaveReport={saveReport}
            onDoneEditingReport={() => { setEditingReport(null); setView("mis-reportes"); }}
            editingActivity={editingActivity}
            onSaveActivity={saveActivityLog}
            onDoneEditingActivity={() => { setEditingActivity(null); setView("mis-reportes"); }}
            showToast={showToast}
          />
        )}
        {!isCoord && view === "mis-reportes" && (
          <MisRegistrosView
            user={currentUser}
            projects={projects}
            reports={reports}
            avances={avances}
            onEditReport={(r) => { setEditingReport(r); setView("nuevo"); }}
            onDeleteReport={deleteReport}
            onEditActivity={(a) => { setEditingActivity(a); setView("nuevo"); }}
            onDeleteActivity={deleteActivityLog}
          />
        )}
        {isCoord && view === "dashboard" && <Dashboard projects={projects} reports={reports} users={users} />}
        {isCoord && view === "reportes" && <ReportsTable reports={reports} projects={projects} users={users} onDelete={deleteReport} />}
        {isCoord && view === "actividades" && <ActivitiesDashboard projects={projects} avances={avances} users={users} onDelete={deleteActivityLog} />}
        {isCoord && view === "proyectos" && <ProjectsManager projects={projects} reports={reports} avances={avances} showToast={showToast} />}
        {isCoord && view === "usuarios" && <UsersManager users={users} projects={projects} currentUser={currentUser} showToast={showToast} />}
        {view === "documentos" && <DocumentsView user={currentUser} projects={projects} documents={documents} onUpload={saveDocumentFile} onDelete={removeDocumentFile} showToast={showToast} />}
      </main>
      <Toast message={toast} onClose={() => setToast("")} />
    </div>
  );
}

/* =========================================================================
   RED DE SEGURIDAD — si algo falla al renderizar, mostrar un mensaje
   legible en vez de dejar la pantalla en blanco.
========================================================================= */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("Error capturado por ErrorBoundary:", error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div className="min-h-screen flex items-center justify-center px-[2rem]">
          <div className="bg-white rounded-[1.4rem] border border-red-200 shadow-lg p-[3.2rem] max-w-[56rem] text-center">
            <p className="text-[2rem] font-bold text-red-600 mb-[1rem]">Ocurrió un error inesperado</p>
            <p className="text-[1.4rem] text-chp-grayLight mb-[1.6rem]">
              Algo falló al cargar esta pantalla. Suele deberse a un dato faltante o mal escrito en Firestore
              (por ejemplo, un campo vacío en el perfil de un usuario o en un proyecto).
            </p>
            <p className="text-[1.2rem] text-left bg-gray-50 rounded-[0.8rem] p-[1.4rem] font-mono text-red-700 mb-[1.6rem] overflow-x-auto">
              {String(this.state.error && this.state.error.message)}
            </p>
            <button
              onClick={() => window.location.reload()}
              className="bg-chp-blue text-white rounded-[0.8rem] px-[2rem] py-[1.1rem] font-semibold"
            >
              Recargar la página
            </button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
